<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Actions Launcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="qal-panel">
      <div class="qal-search-container">
        <span class="qal-search-icon">&#x2315;</span>
        <input
          type="text"
          class="qal-input"
          data-i18n-placeholder="launcher.placeholder"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="qal-shortcut-hint" data-i18n="launcher.escHint"></span>
      </div>
      <div class="qal-results" role="listbox"></div>
      <div class="qal-footer">
        <span data-i18n="launcher.footer.navigate"></span>
        <span data-i18n="launcher.footer.open"></span>
        <span data-i18n="launcher.footer.newTab"></span>
        <span data-i18n="launcher.footer.close"></span>
      </div>
    </div>

    <script src="../src/search-utils.js"></script>
    <script src="../src/config-storage.js"></script>
    <script src="../src/i18n.js"></script>
    <script src="popup-render.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
