<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Tab Launcher</title>
    <link rel="stylesheet" href="../content/launcher.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="qal-popup">
    <div class="qal-overlay">
      <div class="qal-panel">
        <div class="qal-search-container">
          <span class="qal-search-icon"></span>
          <input
            type="text"
            class="qal-input"
            data-i18n-placeholder="launcher.placeholder"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-controls="qal-results"
            aria-expanded="true"
            aria-autocomplete="list"
          />
          <button
            type="button"
            class="qal-toggle qal-group-toggle"
            aria-pressed="false"
          ></button>
          <button
            type="button"
            class="qal-toggle qal-fulltext-toggle"
            aria-pressed="false"
          ></button>
        </div>
        <div class="qal-toast-slot" aria-live="polite"></div>
        <div class="qal-results" id="qal-results" role="listbox"></div>
        <div class="qal-footer"></div>
      </div>
    </div>

    <script src="../src/config-storage.js"></script>
    <script src="../src/search-utils.js"></script>
    <script src="../src/fuzzy.js"></script>
    <script src="../src/i18n.js"></script>
    <script src="../src/commands.js"></script>
    <script src="../src/icons.js"></script>
    <script src="../src/hints.js"></script>
    <script src="../src/render-utils.js"></script>
    <script src="../src/panel-extras.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
