<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="options.title">Quick Actions Launcher</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="qal-options-container">
      <header class="qal-options-header">
        <div class="qal-options-header-row">
          <div>
            <h1 class="qal-options-title" data-i18n="options.title"></h1>
            <p class="qal-options-subtitle" data-i18n="options.subtitle"></p>
          </div>
          <div class="qal-locale-switcher" id="qal-locale-switcher">
            <button
              type="button"
              class="qal-locale-btn"
              data-locale="it"
              title="Italiano"
            >
              &#x1F1EE;&#x1F1F9;
            </button>
            <button
              type="button"
              class="qal-locale-btn"
              data-locale="en"
              title="English"
            >
              &#x1F1FA;&#x1F1F8;
            </button>
          </div>
        </div>
      </header>

      <main>
        <form id="qal-options-form" class="qal-options-form" novalidate>
          <fieldset class="qal-options-fieldset">
            <legend
              class="qal-options-legend"
              data-i18n="options.legend.resultsByType"
            ></legend>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-max-tab-results">
                <span data-i18n="options.label.openTabs"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.openTabs"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-max-tab-results"
                type="number"
                min="1"
                max="50"
                step="1"
                required
              />
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-max-bookmark-results">
                <span data-i18n="options.label.bookmarks"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.bookmarks"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-max-bookmark-results"
                type="number"
                min="1"
                max="50"
                step="1"
                required
              />
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-max-history-results">
                <span data-i18n="options.label.history"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.history"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-max-history-results"
                type="number"
                min="1"
                max="50"
                step="1"
                required
              />
            </div>
          </fieldset>

          <fieldset class="qal-options-fieldset">
            <legend
              class="qal-options-legend"
              data-i18n="options.legend.behavior"
            ></legend>

            <div class="qal-options-field">
              <label
                class="qal-options-label qal-options-label--checkbox"
                for="qal-enable-fulltext-search"
              >
                <input
                  type="checkbox"
                  class="qal-options-checkbox"
                  id="qal-enable-fulltext-search"
                />
                <span data-i18n="options.label.fulltextSearch"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.fulltextSearch"
                ></span>
              </label>
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-debounce-ms">
                <span data-i18n="options.label.debounce"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.debounce"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-debounce-ms"
                type="number"
                min="0"
                max="2000"
                step="10"
                required
              />
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-history-days">
                <span data-i18n="options.label.historyDays"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.historyDays"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-history-days"
                type="number"
                min="1"
                max="365"
                step="1"
                required
              />
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-min-query-length">
                <span data-i18n="options.label.minQueryLength"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.minQueryLength"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-min-query-length"
                type="number"
                min="1"
                max="10"
                step="1"
                required
              />
            </div>

            <div class="qal-options-field">
              <label class="qal-options-label" for="qal-loading-threshold-ms">
                <span data-i18n="options.label.loadingThreshold"></span>
                <span
                  class="qal-options-hint"
                  data-i18n="options.hint.loadingThreshold"
                ></span>
              </label>
              <input
                class="qal-options-input"
                id="qal-loading-threshold-ms"
                type="number"
                min="0"
                max="5000"
                step="50"
                required
              />
            </div>
          </fieldset>

          <p
            id="qal-feedback"
            class="qal-options-feedback"
            aria-live="polite"
          ></p>

          <div class="qal-options-actions">
            <button
              type="submit"
              class="qal-options-btn qal-options-btn--primary"
              id="qal-save-btn"
              data-i18n="options.btn.save"
            ></button>
            <button
              type="button"
              class="qal-options-btn qal-options-btn--secondary"
              id="qal-reset-btn"
              data-i18n="options.btn.reset"
            ></button>
          </div>
        </form>
      </main>
    </div>

    <script src="../src/search-utils.js"></script>
    <script src="../src/config-storage.js"></script>
    <script src="../src/i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
